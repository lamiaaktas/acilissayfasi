<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Lab - Çoklu Sınıf Planı v13</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .bg-grid {
            background-color: #f8fafc;
            background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                              linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        .desk-input {
            background-color: transparent;
            text-align: center;
            font-weight: 700;
            color: #1e293b;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .desk-input:focus { outline: none; border-color: #818cf8; background-color: #ffffff; border-radius: 4px;}
        input::placeholder { color: #cbd5e1; font-weight: 600; font-size: 10px; }
        ::-webkit-scrollbar { display: none; }

        @media print {
            @page { size: landscape; margin: 0; }
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background-color: white !important; }
            header, #bulk-modal { display: none !important; }
            main { padding: 5px !important; }
            .bg-grid { background-image: none !important; background-color: white !important; }
            .shadow-xl, .shadow-md, .shadow-sm { box-shadow: none !important; }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-50 flex flex-col text-slate-800">

    <!-- ÜST MENÜ -->
    <header class="h-16 shrink-0 bg-white border-b border-slate-200 shadow-sm z-20 px-4 sm:px-6 flex justify-between items-center w-full gap-2 relative">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-lg hidden lg:block shadow-md shadow-indigo-200">
                <svg class="text-white w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>
            <div>
                <h1 class="text-sm sm:text-lg font-bold leading-tight">Tech Lab</h1>
                <p class="text-[9px] sm:text-[10px] text-slate-500 font-bold tracking-wider uppercase">Simetrik Sınıf Planı</p>
            </div>
        </div>

        <div class="flex flex-1 items-center justify-end gap-2 sm:gap-3">
            <div class="bg-indigo-50 border border-indigo-100 text-indigo-700 px-3 py-1.5 rounded-md flex items-center gap-1 shadow-sm font-bold text-xs sm:text-sm">
                <span id="occupancy-count">0/25</span> <span class="hidden sm:inline">Dolu</span>
            </div>

            <div class="relative hidden sm:block">
                <div class="absolute inset-y-0 left-0 pl-2 flex items-center pointer-events-none">
                    <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <input type="text" oninput="searchName(this.value)" placeholder="İsim Ara..." class="bg-slate-100 border border-slate-200 text-slate-800 text-xs sm:text-sm rounded-md pl-8 pr-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all w-28 sm:w-40 font-semibold">
            </div>

            <div class="w-px h-6 bg-slate-200 mx-0.5"></div>

            <select id="class-select" onchange="changeClass(this.value)" class="bg-white border border-slate-300 text-slate-800 text-xs sm:text-sm rounded-md px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-400 font-bold cursor-pointer shadow-sm"></select>
            
            <button onclick="openBulkModal()" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 px-3 py-1.5 rounded-md text-xs sm:text-sm font-bold transition-colors shadow-sm flex items-center gap-1">
                <svg class="w-4 h-4 hidden sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> Toplu Ekle
            </button>

            <button onclick="shuffleSeats()" class="bg-amber-100 text-amber-800 hover:bg-amber-200 px-3 py-1.5 rounded-md text-xs sm:text-sm font-bold transition-colors shadow-sm hidden md:block">Karıştır</button>
            <button onclick="clearClass()" class="bg-red-50 text-red-700 hover:bg-red-100 border border-red-200 px-3 py-1.5 rounded-md text-xs sm:text-sm font-bold transition-colors shadow-sm hidden lg:block">Temizle</button>
            <button onclick="window.print()" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-md text-xs sm:text-sm font-bold transition-colors shadow-sm hidden lg:block">Yazdır</button>
            
            <button onclick="saveData()" class="bg-slate-900 text-white hover:bg-slate-800 px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold shadow-sm transition-colors flex items-center gap-1">Buluta Kaydet</button>
        </div>
    </header>

    <!-- TOPLU EKLEME MODALI -->
    <div id="bulk-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 relative">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-800">Toplu Öğrenci Listesi</h2>
                <button onclick="closeBulkModal()" class="text-slate-400 hover:text-red-500 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <textarea id="bulk-textarea" class="w-full h-64 bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-400 outline-none resize-none mb-4 font-medium text-slate-700 shadow-inner" placeholder="İsimleri yapıştırın. Boş masalar için boş satır bırakın..."></textarea>
            <div class="flex justify-end gap-3">
                <button onclick="closeBulkModal()" class="px-4 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-bold transition-colors">İptal</button>
                <button onclick="applyBulkNames()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-bold transition-colors shadow-sm">Sınıfa Yerleştir</button>
            </div>
        </div>
    </div>

    <!-- ANA LABORATUVAR ALANI -->
    <main class="flex-1 relative bg-grid p-3 sm:p-6 lg:p-8 flex items-center justify-center w-full h-full">
        <div id="loader" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm z-50 flex items-center justify-center rounded-2xl">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent"></div>
        </div>

        <div class="w-full max-w-[1300px] h-full bg-white/95 backdrop-blur-md shadow-2xl rounded-3xl border border-slate-200 relative flex justify-between px-8 sm:px-12 overflow-hidden gap-4 sm:gap-8">
            
            <div class="absolute left-0 top-0 bottom-0 w-3 bg-slate-300 border-r border-slate-400 z-0"></div>
            <div class="absolute right-0 top-0 bottom-0 w-5 bg-red-600 shadow-[0_0_20px_rgba(220,38,38,0.3)] border-l-2 border-red-800 z-0 flex items-center justify-center"></div>

            <div id="lab-container" class="flex-1 flex justify-between w-full h-full py-6 relative z-10">
                <!-- Javascript -->
            </div>
        </div>
    </main>

    <script>
        // GOOGLE SCRIPT BAĞLANTISI
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykGkE_cFQIjVOSNikd01WwcTeoq0dkmr5GI99U-vp9nPQzjyTe7Ykgav2P6zx2nEM3/exec";

        const imacSVG = `
        <svg viewBox="0 0 120 85" class="w-full h-full drop-shadow-sm">
          <path d="M50 65 L70 65 L75 85 L45 85 Z" fill="#cbd5e1"/>
          <rect x="55" y="60" width="10" height="10" fill="#94a3b8"/>
          <rect x="5" y="5" width="110" height="60" rx="4" fill="#334155"/>
          <rect x="8" y="8" width="104" height="42" fill="#f1f5f9"/>
          <rect x="5" y="52" width="110" height="13" fill="#e2e8f0"/>
          <circle cx="60" cy="58.5" r="2" fill="#94a3b8"/>
        </svg>`;

        let currentClass = '1A';
        let seats = [];

        const layoutMap = {
            col1: [8, 7, 6, 5, 4, 3, 2, 1],
            col2: [12, 11, 10, 9, null, null, null, null],
            col3: [17, 16, 15, 14, 13, null, null, null],
            col4: [25, 24, 23, 22, 21, 20, 19, 18]
        };

        function initClasses() {
            const select = document.getElementById('class-select');
            ['1','2','3','4'].forEach(level => {
                ['A','B','C','D'].forEach(section => { select.add(new Option(level+section, level+section)); });
            });
            const savedClass = localStorage.getItem('techLab_currentClass');
            if (savedClass) { currentClass = savedClass; select.value = currentClass; }
            loadClassData(currentClass);
        }

        function loadClassData(className) {
            const data = localStorage.getItem('techLab_data_' + className);
            seats = data ? JSON.parse(data) : Array.from({ length: 25 }, (_, i) => ({ id: i + 1, name: '' }));
            renderLab();
        }

        function saveCurrentClassData() {
            localStorage.setItem('techLab_data_' + currentClass, JSON.stringify(seats));
            updateOccupancy();
        }

        function changeClass(newClass) {
            saveCurrentClassData(); currentClass = newClass;
            localStorage.setItem('techLab_currentClass', currentClass);
            loadClassData(currentClass);
        }

        function updateOccupancy() {
            const filled = seats.filter(s => s.name.trim() !== '').length;
            document.getElementById('occupancy-count').textContent = `${filled}/25`;
        }

        function openBulkModal() {
            document.getElementById('bulk-textarea').value = seats.map(s => s.name).join('\n');
            document.getElementById('bulk-modal').classList.remove('hidden');
        }
        
        function closeBulkModal() { document.getElementById('bulk-modal').classList.add('hidden'); }

        function applyBulkNames() {
            const names = document.getElementById('bulk-textarea').value.split('\n');
            seats.forEach((seat, index) => { seat.name = names[index] !== undefined ? names[index].trim() : ''; });
            renderLab(); saveCurrentClassData(); closeBulkModal();
        }

        function renderLab() {
            const container = document.getElementById('lab-container');
            container.innerHTML = '';

            const createColumnFromMap = (layoutArray, chairOnRight) => {
                const col = document.createElement('div');
                col.className = `grid grid-rows-8 gap-2 sm:gap-3 w-[20%] h-full z-10`;
                
                layoutArray.forEach(id => {
                    if (id === null) {
                        col.innerHTML += `<div></div>`; 
                        return;
                    }

                    const seat = seats[id - 1];
                    const chairPos = chairOnRight ? '-right-2 sm:-right-4' : '-left-2 sm:-left-4';

                    col.innerHTML += `
                        <div id="desk-container-${seat.id}" class="relative w-full h-full flex items-center justify-center group">
                            <div class="relative w-full max-w-[150px] aspect-[120/85] flex items-center justify-center transition-transform duration-300 group-hover:scale-[1.03]">
                                <div class="absolute inset-0 pointer-events-none z-10">
                                    ${imacSVG}
                                </div>
                                <input type="text" class="desk-input absolute text-[10px] sm:text-[12px] md:text-[14px] z-20 truncate" 
                                style="left: 9%; top: 12%; width: 82%; height: 45%;" 
                                placeholder="İsim Gir" value="${seat.name}" oninput="updateName(${seat.id}, this.value)">
                                
                                <div class="absolute -top-1.5 -right-1.5 sm:-right-2 w-4 h-4 sm:w-5 sm:h-5 bg-[#5b5fd8] text-white text-[9px] sm:text-[10px] rounded-sm flex items-center justify-center font-bold z-30 shadow-md">
                                    ${seat.id}
                                </div>

                                <div class="absolute top-1/2 -translate-y-[60%] ${chairPos} w-2.5 sm:w-3.5 h-[50%] bg-[#fbbc04] rounded-full z-0 opacity-90"></div>
                            </div>
                        </div>
                    `;
                });
                return col;
            };

            const islandBg = document.createElement('div');
            islandBg.className = 'absolute top-2 bottom-[90px] left-[25%] right-[25%] bg-[#f8fafc] border border-slate-200 rounded-3xl z-0';
            islandBg.innerHTML = '<div class="absolute left-1/2 top-6 bottom-6 w-0.5 bg-slate-300 -translate-x-1/2 rounded-full"></div>';
            container.appendChild(islandBg);

            const teacherDesk = document.createElement('div');
            teacherDesk.className = 'absolute bottom-4 left-[28%] right-[28%] h-12 bg-[#2d3748] rounded-xl flex items-center justify-center text-white text-xs font-bold tracking-widest shadow-lg z-20';
            teacherDesk.innerHTML = 'ÖĞRETMEN MASASI';
            container.appendChild(teacherDesk);

            container.appendChild(createColumnFromMap(layoutMap.col1, true));
            container.appendChild(createColumnFromMap(layoutMap.col2, false));
            container.appendChild(createColumnFromMap(layoutMap.col3, true));
            container.appendChild(createColumnFromMap(layoutMap.col4, false));

            updateOccupancy();
        }

        function updateName(id, value) { seats[id - 1].name = value; saveCurrentClassData(); }

        function shuffleSeats() {
            const names = seats.map(s => s.name);
            for (let i = names.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [names[i], names[j]] = [names[j], names[i]];
            }
            seats.forEach((seat, index) => seat.name = names[index]);
            renderLab(); saveCurrentClassData();
        }

        function clearClass() {
            if(confirm(`${currentClass} sınıfı tamamen temizlenecek. Emin misiniz?`)) {
                seats.forEach(seat => seat.name = '');
                renderLab(); saveCurrentClassData();
            }
        }

        function searchName(query) {
            const q = query.toLowerCase().trim();
            seats.forEach(seat => {
                const deskEl = document.getElementById(`desk-container-${seat.id}`);
                if (!deskEl) return;
                if (q !== '' && seat.name.toLowerCase().includes(q)) {
                    deskEl.classList.add('scale-105'); 
                    deskEl.classList.remove('opacity-30');
                } else if (q !== '') {
                    deskEl.classList.remove('scale-105'); 
                    deskEl.classList.add('opacity-30');
                } else {
                    deskEl.classList.remove('scale-105', 'opacity-30');
                }
            });
        }

        function toggleLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }

        // YENİ VE GÜVENLİ KAYDETME FONKSİYONU
        async function saveData() {
            toggleLoader(true);
            try {
                // Hem sınıf adını hem de listeyi paketliyoruz
                const payload = {
                    className: currentClass,
                    seats: seats
                };

                const response = await fetch(APP_SCRIPT_URL, { 
                    method: 'POST',
                    // Tarayıcının veriyi bozmadan iletmesini sağlayan GÜVENLİ HEADER ayarı
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    },
                    body: JSON.stringify(payload) 
                });
                
                const resultText = await response.text();
                
                // Gelen yanıtı kontrol et
                if(resultText.includes("Hata")) {
                    alert("Google E-Tabloya bağlanılamadı. Detay: " + resultText);
                } else {
                    alert(`${currentClass} sınıfı E-Tabloda "${currentClass}" isimli sekmesine başarıyla kaydedildi!`);
                }
                
            } catch (error) { 
                alert("İnternet bağlantısı koptu veya ağ hatası oluştu."); 
            }
            toggleLoader(false);
        }

        window.onload = initClasses;
    </script>
</body>
</html>
